<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NachitoWidget</title>
  <link rel="icon" href="resources/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="common/tools/media_viewer/MediaViewer.css">
  <meta name="x-icue-property" content="backgroundMedia" data-label="'Imagen de fondo'" data-type="media-selector" data-filters="['*.png', '*.jpg', '*.jpeg', '*.webp', '*.gif']">
  <meta name="x-icue-property" content="weatherCity" data-label="'Ciudad (ej.: Rosario, Argentina)'" data-type="textfield" data-default="'Santa Fe, Argentina'">
  <script type="application/json" id="x-icue-groups">
    [{"title":"'Clima'","properties":["weatherCity"]},{"title":"'Fondo'","properties":["backgroundMedia"]}]
  </script>
</head>
<body>
  <main id="content">
    
   <header>
    <span id="city"></span>

    <span id="temperature"></span>
</header>

    <section id="background" aria-hidden="true">
      <div id="background-media"></div>


    </section>

 <footer>

    <div id="song-viewport"><span id="song"></span></div>

    <div id="platform"></div>

</footer>
  
  </main>
  
  <script src="common/plugins/IcueWidgetApiWrapper.js"></script>
  <script src="common/plugins/SimpleMediaApiWrapper.js"></script>
  <script src="scripts/song-scroller.js"></script>
  <script src="scripts/main.js"></script>
  <script src="common/tools/media_viewer/MediaViewer.js"></script>
  <script src="scripts/background.js"></script>
</body>
</html>
